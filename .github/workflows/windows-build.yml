name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenToolbox opentoolbox.py
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\OpenToolbox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist\OpenToolbox.exe.sha256" -Value "$hash  OpenToolbox.exe" -Encoding ascii
          Get-Item "dist\OpenToolbox.exe"
          Get-Content "dist\OpenToolbox.exe.sha256"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenToolbox-Windows-x64
          path: |
            dist/OpenToolbox.exe
            dist/OpenToolbox.exe.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenToolbox-Windows-x64
          path: release
      - name: Publish v0.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.4.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenToolbox v0.4.1" --notes "Windows distribution release. Includes the standalone OpenToolbox GUI executable and SHA-256 checksum. FFmpeg, ImageMagick, ExifTool, yt-dlp and Pandoc remain external tools detected from PATH."
          fi
          gh release upload v0.4.1 release/OpenToolbox.exe release/OpenToolbox.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
